services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    
  presidio-analyzer:
    build:
      context: ./infra
      dockerfile: Dockerfile.presidio
    container_name: presidio_analyzer
    image: presidio-analyzer:latest
    ports:
      - "127.0.0.1:5001:3000"
    volumes:
      - ./infra/custom_app.py:/app/custom_app.py:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Helper container that automatically pulls the model once Ollama starts
  ollama-model-pull:
    image: curlimages/curl:latest
    container_name: ollama_model_pull
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
      echo 'Waiting for Ollama to be ready...';
      until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
      echo 'Pulling smollm:135m model...';
      curl -s http://ollama:11434/api/pull -d '{\"name\": \"smollm:135m\"}';
      echo 'Model ready!';
      "

volumes:
  ollama_data: