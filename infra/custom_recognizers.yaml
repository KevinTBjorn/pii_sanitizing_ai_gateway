recognizers:
  - name: DkEmailRecognizer
    supported_entity: EMAIL_ADDRESS
    supported_language: da
    patterns:
      - name: email_pattern
        regex: '(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'
        score: 1.0

  - name: DkIpRecognizer
    supported_entity: IP_ADDRESS
    supported_language: da
    patterns:
      - name: ip_pattern
        regex: '\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b'
        score: 0.95

  - name: DkCreditCardRecognizer
    supported_entity: CREDIT_CARD
    supported_language: da
    patterns:
      - name: credit_card_pattern
        regex: '\b(?:\d[ -]*?){13,19}\b'
        score: 1.0

  - name: DkCprRecognizer
    supported_entity: DK_CPR
    supported_language: da
    patterns:
      - name: cpr_pattern
        regex: '\b(0[1-9]|[12][0-9]|3[01])(0[1-9]|1[0-2])[0-9]{2}[- ]?[0-9]{4}\b'
        score: 0.85
    context:
      - cpr
      - cpr-nr
      - personnummer